[workspace]
resolver = "2"
members = ["interface", "pinocchio/interface", "pinocchio/program", "program"]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
edition = "2021"
repository = "https://github.com/solana-program/token"
license = "Apache-2.0"

[workspace.dependencies]
agave-feature-set = "3.0.0"
arrayref = "0.3.9"
assert_matches = "1.5.0"
bytemuck = "1.20.0"
lazy_static = "1.5.0"
mollusk-svm = "0.6.3"
mollusk-svm-fuzz-fixture = "0.6.3"
num-derive = "0.4"
num_enum = "0.7.3"
num-traits = "0.2"
pinocchio = { path = "../pinocchio/sdk/pinocchio", version = "0.10.0" }
pinocchio-log = { version = "0.5.1", default-features = false }
pinocchio-pubkey = "0.3"
pinocchio-token-interface = { path = "pinocchio/interface", version = "^0" }
proptest = "1.5"
serial_test = "3.2.0"
solana-account = "3.0.0"
solana-account-info = "3.0.0"
solana-address = "1.0.0"
solana-clock = "3.0.0"
solana-cpi = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.0"
solana-msg = "3.0.0"
solana-native-token = "3.0.0"
solana-program-entrypoint = "3.0.0"
solana-program-error = "3.0.0"
solana-program-memory = "3.0.0"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
solana-program-test = "3.0.0"
solana-pubkey = "3.0.0"
solana-rent = "3.0.0"
solana-sdk-ids = "3.0.0"
solana-signature = "3.0.0"
solana-signer = "3.0.0"
solana-system-interface = "2.0"
solana-sysvar = "3.0.0"
solana-transaction = "3.0.0"
solana-transaction-error = "3.0.0"
spl-token-2022-interface = "2.0"
spl-token-interface = "2.0"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-alloc", "custom-panic", "frozen-abi", "no-entrypoint"))',
]

[workspace.metadata.cli]
solana = "3.0.0"

# Specify Rust toolchains for rustfmt, clippy, and build.
# Any unprovided toolchains default to stable.
[workspace.metadata.toolchains]
format = "nightly-2025-02-16"
lint = "nightly-2025-02-16"

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"

[workspace.metadata.release]
pre-release-commit-message = "Publish {{crate_name}} v{{version}}"
tag-message = "Publish {{crate_name}} v{{version}}"
consolidate-commits = false
