[package]
name = "pinocchio-token-program-v2"
version = "0.2.0"
authors = { workspace = true }
edition = { workspace = true }
description = "A pinocchio-based Token program that uses Account API v2"
readme = "./README.md"
repository = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = { workspace = true, features = ["solana-address"] }
pinocchio-log = { workspace = true, default-features = false }
pinocchio-macro = { path = "../../../pinocchio/sdk/pinocchio-macro", version = "0.10.0" }
pinocchio-token-interface = { workspace = true }

[dev-dependencies]
agave-feature-set = { workspace = true }
assert_matches = { workspace = true }
mollusk-svm = { workspace = true }
mollusk-svm-fuzz-fixture = { workspace = true }
num-traits = { workspace = true }
pinocchio = { workspace = true, features = ["solana-address", "test-utils"] }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-program-error = { workspace = true }
solana-program-option = { workspace = true }
solana-program-pack = { workspace = true }
solana-program-test = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
spl-token-2022-interface = { workspace = true }
spl-token-interface = { workspace = true }

[features]
logging = []

[lints]
workspace = true
